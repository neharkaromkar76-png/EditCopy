name: Build EditCopy APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Build Environment
        run: |
          echo "===> Preparing environment for Android APK build..."
          # Ensure .env file exists for secrets-gradle-plugin
          if [ ! -f .env ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          fi

          # Ensure debug.keystore exists as required by signingConfigs in app/build.gradle.kts
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure gradlew has executable permission
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          echo "===> Compiling EditCopy Debug APK..."
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Exists
        run: |
          echo "===> Verifying generated APK..."
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "SUCCESS: APK found at $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: APK was not generated at expected path: $APK_PATH"
            echo "Inspecting all files in app/build/outputs:"
            find app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EditCopy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
